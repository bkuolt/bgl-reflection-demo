version: '3'

tasks:
  default:
    desc: "Build application"
    deps: [build]

  lock:
    desc: "Generate conan.lock file"
    cmds:
      - conan lock create conanfile.py --build=missing

  conan-install:
    desc: "Install dependencies using Conan 2.x"
    cmds:
      - CMAKE_POLICY_VERSION_MINIMUM=3.5 conan install . --lockfile=conan.lock --build=missing -s build_type=Debug

  configure:
    desc: "Configure CMake using Conan toolchain preset"
    deps: [conan-install]
    cmds:
      - cmake --preset conan-debug

  build:
    desc: "Build executable"
    deps: [configure]
    cmds:
      - cmake --build --preset conan-debug

  run:
    desc: "Run bgl-reflection-demo executable"
    cmds:
      - ./build/Debug/bgl-reflection-demo

  rebuild:
    desc: "Clean and rebuild from scratch"
    cmds:
      - task: clean
      - task: build

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf build CMakeUserPresets.json
